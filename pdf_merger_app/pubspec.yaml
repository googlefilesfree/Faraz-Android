name: pdf_excel_merger
description: PDF & Excel File Merger - Designed by Muhammad Usman
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^6.1.1
  pdf: ^3.10.8
  syncfusion_flutter_pdf: ^24.1.41
  excel: ^4.0.3
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  open_file: ^3.3.2
  flutter_pdfview: ^1.3.2
  provider: ^6.1.1
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
